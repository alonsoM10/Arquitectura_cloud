# Frontend en Fargate: nginx SOLO sirve los archivos estáticos.
# El enrutamiento de /api/* lo hace el ALB (reglas por método HTTP),
# no nginx. Por eso NO hay proxy_pass aquí (esos upstreams solo existían
# en la red local de docker-compose y hacían fallar a nginx en Fargate).
server {
    listen 80;
    server_name _;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

