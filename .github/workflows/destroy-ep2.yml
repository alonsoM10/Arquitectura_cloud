name: Destroy EP2 (EKS + RDS Multi-AZ)

# Apaga TODA la infraestructura de EP2 para no gastar el presupuesto del
# laboratorio. Ejecutar siempre después de capturar la evidencia.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de la corrida de Deploy de la que tomar el estado (vacío = la última)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/terraform-ep2
  CLUSTER_NAME: freshbox-cluster
  NAMESPACE: freshbox

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (del Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # Se descarga el estado con el CLI oficial de GitHub (gh), que lista
      # las corridas del deploy SIN filtrar por resultado. La acción de
      # terceros solo miraba corridas "success" y por eso no hallaba el
      # estado cuando el deploy fallaba, que es justo cuando hay que
      # destruir. Si se indica run_id, usa esa corrida; si no, la última
      # que tenga el artifact tfstate-ep2.
      - name: Recuperar el estado del despliegue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_ID_INPUT:-}" ]; then
            RUN_ID="$RUN_ID_INPUT"
          else
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow deploy-ep2.yml \
              --limit 20 --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[].databaseId' \
            | while read -r id; do
                if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                     --jq '.artifacts[].name' 2>/dev/null | grep -qx tfstate-ep2; then
                  echo "$id"; break
                fi
              done)"
          fi

          if [ -z "${RUN_ID:-}" ]; then
            echo "::error::No se encontró ninguna corrida de Deploy con el artifact tfstate-ep2."
            exit 1
          fi

          echo "Usando el estado de la corrida de Deploy #$RUN_ID"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name tfstate-ep2 \
            --dir "$TF_DIR"
          ls -la "$TF_DIR"/terraform.tfstate

      # El Ingress crea un ALB que Terraform NO conoce (lo creó el
      # controller). Si no se borra primero, quedan ENIs colgando y el
      # destroy de la VPC falla. Por eso se elimina el Ingress antes.
      - name: Eliminar el Ingress para liberar el ALB
        continue-on-error: true
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" || exit 0
          kubectl delete ingress freshbox-ingress -n "$NAMESPACE" --ignore-not-found --timeout=5m
          echo ">> Esperando a que el controller borre el ALB..."
          sleep 60

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false

      - name: Confirmación
        run: echo "Infraestructura de EP2 destruida. Presupuesto del lab a salvo."
