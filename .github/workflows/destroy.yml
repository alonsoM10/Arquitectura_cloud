name: Destroy (Terraform)

# Se ejecuta manualmente. Destruye TODA la infraestructura para no gastar
# presupuesto del Learner Lab. Úsalo apenas termines de capturar evidencia.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/terraform

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS (del Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Descargar estado del último deploy
        uses: dawidd6/action-download-artifact@v6
        with:
          name: tfstate
          workflow: deploy.yml
          path: ${{ env.TF_DIR }}
          if_no_artifact_found: fail

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform destroy -auto-approve -input=false
