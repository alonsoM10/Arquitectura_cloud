server {
    listen 80;
    server_name localhost;

    # Health check del ALB. Los 4 microservicios Node.js ya exponen /health;
    # se agrega aquí para que el frontend use la MISMA ruta y todos los
    # target groups del ALB queden healthy con un unico healthcheck-path.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"OK","service":"frontend"}';
    }

    location / { root /usr/share/nginx/html; index index.html; }

    # Proxys internos: solo se usan si se accede al frontend directamente.
    # En la arquitectura desplegada el ALB Ingress enruta /api/* hacia cada
    # microservicio segun el metodo HTTP, sin pasar por Nginx.
    location /api/products { proxy_pass http://get-products:3001; proxy_set_header Host $host; }
    location ~ ^/api/products/(\d+)$ {
        if ($request_method = PUT) { proxy_pass http://update-product:3003; }
        if ($request_method = DELETE) { proxy_pass http://delete-product:3004; }
        proxy_set_header Host $host;
    }
}
