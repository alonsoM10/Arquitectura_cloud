apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: get-products-hpa
  namespace: freshbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: get-products
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
