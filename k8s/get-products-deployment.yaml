apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-products
  namespace: freshbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: get-products
  template:
    metadata:
      labels:
        app: get-products
    spec:
      containers:
      - name: get-products
        image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/freshbox-get-products:latest
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          valueFrom: { configMapKeyRef: { name: freshbox-config, key: DB_HOST } }
        - name: DB_NAME
          valueFrom: { configMapKeyRef: { name: freshbox-config, key: DB_NAME } }
        - name: DB_PORT
          valueFrom: { configMapKeyRef: { name: freshbox-config, key: DB_PORT } }
        - name: DB_USER
          valueFrom: { secretKeyRef: { name: freshbox-secret, key: DB_USER } }
        - name: DB_PASS
          valueFrom: { secretKeyRef: { name: freshbox-secret, key: DB_PASS } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: get-products
  namespace: freshbox
spec:
  selector:
    app: get-products
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP

